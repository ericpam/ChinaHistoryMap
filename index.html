              "仁宗：顒琰（1796—1820，嘉慶）— 誅和珅，白蓮教起義",
              "宣宗：旻寧（1820—1850，道光）— 鴉片戰爭簽訂《南京條約》",

const meta=[

const mapEl=document.getElementById('map');const leaflet=L.map('map',{center:[35,105],zoom:4,minZoom:2,maxZoom:12,zoomControl:true});
const modern=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(leaflet);
let historical=null,capitalsLayer=L.layerGroup().addTo(leaflet),current=0,histVisible=true,modernVisible=true,capitalsVisible=true;
function histUrl(layer){return 'https://gis.sinica.edu.tw/ccts/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER='+layer+'&STYLE=_null&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg'}
function yearText(y){return y<0?'前 '+Math.abs(y)+' 年':y+' 年'}
function setHistorical(i){const layer=meta[i].map;if(historical){leaflet.removeLayer(historical);historical=null}if(layer){historical=L.tileLayer(histUrl(layer),{opacity:Number(document.getElementById('histOpacity').value)/100,maxZoom:12,attribution:'歷史地圖：中央研究院人社中心 GIS'});if(histVisible)historical.addTo(leaflet)}}
function render(i,focus=true){current=i;const d=strictDynastyData[i],m=meta[i];document.getElementById('yearLabel').textContent=yearText(m.year);document.getElementById('dynastyLabel').textContent=d.dynasty+'｜'+d.period;document.getElementById('stepLabel').textContent=(i+1)+' / '+strictDynastyData.length;document.getElementById('yearRange').value=i;setHistorical(i);capitalsLayer.clearLayers();if(capitalsVisible)d.states.forEach(st=>{if(!st.coords)return;const marker=L.circleMarker(st.coords,{radius:6,color:'#fff',weight:2,fillColor:'#8b3a2e',fillOpacity:.95}).addTo(capitalsLayer);marker.bindPopup('<b>'+st.name+'</b><br>首都：'+st.capital+'<br><span style="font-size:12px">'+st.desc+'</span>')});if(focus){const pts=d.states.filter(s=>s.coords).map(s=>s.coords);if(pts.length)leaflet.fitBounds(L.latLngBounds(pts).pad(1.8),{maxZoom:5,duration:.7})}}
function buildList(filter=''){const box=document.getElementById('timeline');box.innerHTML='';strictDynastyData.forEach((d,i)=>{const hay=(d.dynasty+' '+d.period+' '+d.states.map(s=>s.name+' '+s.capital+' '+s.monarchs.join(' ')).join(' ')).toLowerCase();if(filter&&!hay.includes(filter.toLowerCase()))return;const group=document.createElement('div');group.className='dynasty-group';const head=document.createElement('div');head.className='dynasty-header';head.innerHTML='<div><span class="arrow">▶</span><span class="dynasty-title">'+d.dynasty+'</span></div><div class="dynasty-years">'+d.period+'</div>';const states=document.createElement('div');states.className='states';d.states.forEach((s)=>{const c=document.createElement('div');c.className='state-card';c.innerHTML='<div class="state-title"><span class="state-name">'+s.name+'</span><span class="capital">'+s.capital+'</span></div><div class="desc">'+s.desc+'</div><ul class="monarchs">'+s.monarchs.map(x=>'<li>'+x+'</li>').join('')+'</ul>';c.onclick=e=>{e.stopPropagation();render(i,true);document.querySelectorAll('.state-card').forEach(x=>x.classList.remove('active'));c.classList.add('active')};states.appendChild(c)});head.onclick=()=>{group.classList.toggle('open');render(i,false)};group.append(head,states);box.appendChild(group)})}
document.getElementById('yearRange').oninput=e=>render(Number(e.target.value),true);document.getElementById('histOpacity').oninput=e=>{if(historical)historical.setOpacity(Number(e.target.value)/100)};document.getElementById('toggleHistorical').onclick=()=>{histVisible=!histVisible;if(historical)histVisible?historical.addTo(leaflet):leaflet.removeLayer(historical)};document.getElementById('toggleModern').onclick=()=>{modernVisible=!modernVisible;modernVisible?modern.addTo(leaflet):leaflet.removeLayer(modern)};document.getElementById('toggleCapitals').onclick=()=>{capitalsVisible=!capitalsVisible;capitalsVisible?capitalsLayer.addTo(leaflet):leaflet.removeLayer(capitalsLayer)};document.getElementById('resetMap').onclick=()=>leaflet.setView([35,105],4);document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.dynasty-group').forEach(g=>g.classList.add('open'));document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.dynasty-group').forEach(g=>g.classList.remove('open'));document.getElementById('search').oninput=e=>buildList(e.target.value.trim());document.getElementById('toggleSidebarBtn').onclick=()=>{const s=document.getElementById('sidebar');s.classList.toggle('collapsed');document.getElementById('toggleSidebarBtn').textContent=s.classList.contains('collapsed')?'▶':'◀';setTimeout(()=>leaflet.invalidateSize(),300)};
buildList();render(0,false);
